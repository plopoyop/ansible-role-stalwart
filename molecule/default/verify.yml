---
- name: Verify
  hosts: all
  tasks:
    - name: "Check group has been created"
      ansible.builtin.group:
        name: "stalwartg"
        state: "present"
      check_mode: true
      register: "stalwart_group_check"

    - name: "Check user has been created"
      ansible.builtin.user:
        name: "stalwartu"
        group: "stalwartg"
        create_home: false
        system: true
      check_mode: true
      register: "stalwart_user_check"

    - name: "Verify stalwart service is running"
      ansible.builtin.service:
        name: "stalwart"
        state: "started"
        enabled: true
      failed_when: false
      check_mode: true
      register: "stalwart_service"

    - name: "Check server install"
      ansible.builtin.stat:
        path: "/opt/stalwart/bin/stalwart"
      register: "st_bin"

    - name: "Check CLI install"
      ansible.builtin.stat:
        path: "/opt/stalwart/bin/stalwart-cli"
      register: "st_cli"

    - name: "Check config file"
      ansible.builtin.stat:
        path: "/opt/stalwart/etc/config.json"
      register: "st_config"

    - name: "Query configured listeners"
      ansible.builtin.command: "/opt/stalwart/bin/stalwart-cli query NetworkListener --fields name"
      environment:
        STALWART_URL: "http://127.0.0.1:8080"
        STALWART_USER: "admin"
        STALWART_PASSWORD: "changeme!"
      changed_when: false
      register: "stalwart_listeners"

    - name: "Query allowed IPs applied through additional configuration"
      ansible.builtin.command: "/opt/stalwart/bin/stalwart-cli query AllowedIp --fields address"
      environment:
        STALWART_URL: "http://127.0.0.1:8080"
        STALWART_USER: "admin"
        STALWART_PASSWORD: "changeme!"
      changed_when: false
      register: "stalwart_allowed_ips"

    - name: "Define deprecated additional config variable"
      ansible.builtin.set_fact:
        stalwart_additionnal_configs:
          - "@type": "upsert"
            object: "AllowedIp"
            matchOn: ["address"]
            value:
              legacy-1:
                address: "192.0.2.0/24"

    - name: "Load role defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"

    - name: "Gather facts on listening ports"
      community.general.listen_ports_facts:

    - name: "Assert conditions"
      ansible.builtin.assert:
        that:
          - not stalwart_group_check.changed
          - not stalwart_user_check.changed
          - not stalwart_service.changed
          - st_bin.stat.mode == "0750"
          - st_cli.stat.exists
          - st_config.stat.mode == "0640"
          - (ansible_facts.tcp_listen | selectattr('port', 'equalto', 25) | length ) > 0
          - (ansible_facts.tcp_listen | selectattr('port', 'equalto', 587) | length ) > 0
          - (ansible_facts.tcp_listen | selectattr('port', 'equalto', 465) | length ) > 0
          - (ansible_facts.tcp_listen | selectattr('port', 'equalto', 993) | length ) > 0
          - (ansible_facts.tcp_listen | selectattr('port', 'equalto', 143) | length ) == 0
          - (ansible_facts.tcp_listen | selectattr('port', 'equalto', 110) | length ) == 0
          - (ansible_facts.tcp_listen | selectattr('port', 'equalto', 4190) | length ) == 0
          - "'smtp' in stalwart_listeners.stdout"
          - "'10.0.0.0/8' in stalwart_allowed_ips.stdout"
          - stalwart_additional_configs == stalwart_additionnal_configs
        success_msg: "All assertions passed!"
        fail_msg: "Some assertions failed!"
