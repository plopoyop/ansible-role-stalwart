---
# @var stalwart_system_user
# @var stalwart_system_user:type: string
# @var stalwart_system_user:description: >
# System user name to create
stalwart_system_user: "stalwart"

# @var stalwart_system_group
# @var stalwart_system_group:type: string
# @var stalwart_system_group:description: >
# System group name to create
stalwart_system_group: "stalwart"

# @var stalwart_component
# @var stalwart_component:type: string
# @var stalwart_component:description: >
# Stalwart component to install : stalwart / stalwart-foundationdb
stalwart_component: "stalwart" # stalwart-foundationdb

# @var stalwart_version
# @var stalwart_version:type: string
# @var stalwart_version:description: >
# Stalwart server version to install
stalwart_version: 0.16.17

# @var stalwart_cli_version
# @var stalwart_cli_version:type: string
# @var stalwart_cli_version:description: >
# Stalwart CLI version to install
stalwart_cli_version: "1.0.10"

# @var stalwart_service_state
# @var stalwart_service_state:type: string
# @var stalwart_service_state:description: >
# Stalwart service desired state
stalwart_service_state: "started"

# @var stalwart_service_enabled
# @var stalwart_service_enabled:type: boolean
# @var stalwart_service_enabled:description: >
# Enable Stalwart service
stalwart_service_enabled: true

# @var stalwart_server_max_connections
# @var stalwart_server_max_connections:type: int
# @var stalwart_server_max_connections:description: >
# Stalwart server max connections
stalwart_server_max_connections: 8192

# @var stalwart_data_store
# @var stalwart_data_store:type: dict
# @var stalwart_data_store:description: >
# Primary data store definition written to config.json. This is the only
# setting kept in the on-disk configuration file; every other setting is
# stored in the database and reconciled through the declarative plan.
# @var stalwart_data_store:example: >
# stalwart_data_store:
#   "@type": "PostgreSql"
#   host: "db.example.com"
#   database: "stalwart"
#   authUsername: "stalwart"
#   authSecret:
#     "@type": "Value"
#     secret: "changeme"
stalwart_data_store:
  "@type": "RocksDb"
  path: "{{ stalwart_data_path }}"

# @var stalwart_server_hostname
# @var stalwart_server_hostname:type: string
# @var stalwart_server_hostname:description: >
# Default hostname used in SMTP greetings, reports and auto configuration.
# When set, the role also provisions the matching default domain. Leave
# undefined to keep the value chosen during the initial bootstrap.
stalwart_server_hostname: ""

# @var stalwart_default_domain
# @var stalwart_default_domain:type: string
# @var stalwart_default_domain:description: >
# Default email domain provisioned and referenced by the system settings.
# Defaults to the parent domain of 'stalwart_server_hostname'.
stalwart_default_domain: "{{ stalwart_server_hostname.split('.', 1)[1] if '.' in stalwart_server_hostname else stalwart_server_hostname }}"

# @var stalwart_fallback_admin_login
# @var stalwart_fallback_admin_login:type: string
# @var stalwart_fallback_admin_login:description: >
# Recovery administrator login. Used with 'STALWART_RECOVERY_ADMIN' to
# bootstrap the deployment and to authenticate the declarative plan.
stalwart_fallback_admin_login: "admin"

# @var stalwart_fallback_admin_password
# @var stalwart_fallback_admin_password:type: string
# @var stalwart_fallback_admin_password:description: >
# Recovery administrator password
stalwart_fallback_admin_password: "changeme!"

# @var stalwart_server_listeners
# @var stalwart_server_listeners:type: list
# @var stalwart_server_listeners:description: >
# Network listeners to create. Each entry maps to a NetworkListener object:
# 'bind' accepts a single address or a list, and 'options' carries any extra
# NetworkListener field (e.g. tlsImplicit, useTls, maxConnections).
stalwart_server_listeners:
  - name: "smtp"
    bind: "[::]:25"
    protocol: "smtp"
  - name: "submission"
    bind: "[::]:587"
    protocol: "smtp"
  - name: "submissions"
    bind: "[::]:465"
    protocol: "smtp"
    options:
      tlsImplicit: true
  - name: "imap"
    bind: "[::]:143"
    protocol: "imap"
  - name: "imaptls"
    bind: "[::]:993"
    protocol: "imap"
    options:
      tlsImplicit: true
  - name: "pop3"
    bind: "[::]:110"
    protocol: "pop3"
  - name: "pop3s"
    bind: "[::]:995"
    protocol: "pop3"
    options:
      tlsImplicit: true
  - name: "sieve"
    bind: "[::]:4190"
    protocol: "manageSieve"
  - name: "https"
    protocol: "http"
    bind: "[::]:443"
    options:
      tlsImplicit: true
  - name: "http"
    protocol: "http"
    bind: "[::]:8080"

# @var stalwart_additional_configs
# @var stalwart_additional_configs:type: list
# @var stalwart_additional_configs:description: >
# Additional declarative plan operations appended verbatim to the generated
# plan. Each entry is a full stalwart-cli apply operation.
# 'stalwart_additionnal_configs' is deprecated but still accepted as an alias.
# @var stalwart_additional_configs:example: >
# stalwart_additional_configs:
#   - "@type": "update"
#     object: "Imap"
#     value:
#       maxRequestSize: 52428800
#   - "@type": "upsert"
#     object: "AllowedIp"
#     matchOn: ["address"]
#     value:
#       allow-1:
#         address: "10.0.0.0/8"
stalwart_additional_configs: "{{ stalwart_additionnal_configs | default([]) }}"
