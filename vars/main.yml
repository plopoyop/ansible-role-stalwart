---
stalwart_download_url: "https://github.com/stalwartlabs/stalwart/releases/download/v{{ stalwart_version }}/{{ stalwart_component }}-{{ ansible_architecture }}-unknown-linux-gnu.tar.gz"
stalwart_cli_download_url: "https://github.com/stalwartlabs/cli/releases/download/v{{ stalwart_cli_version }}/stalwart-cli-{{ ansible_architecture }}-unknown-linux-gnu.tar.xz"

stalwart_install_path: "/opt/stalwart"
stalwart_bin_path: "{{ stalwart_install_path }}/bin"
stalwart_config_path: "{{ stalwart_install_path }}/etc"
stalwart_logs_path: "{{ stalwart_install_path }}/logs"
stalwart_data_path: "{{ stalwart_install_path }}/data"

stalwart_executable_path: "{{ stalwart_bin_path }}/stalwart"
stalwart_cli_executable_path: "{{ stalwart_bin_path }}/stalwart-cli"
stalwart_config_file_path: "{{ stalwart_config_path }}/config.json"
stalwart_env_file_path: "{{ stalwart_config_path }}/stalwart.env"
stalwart_plan_file_path: "{{ stalwart_config_path }}/plan.ndjson"
stalwart_bootstrap_sentinel_path: "{{ stalwart_config_path }}/.bootstrapped"

stalwart_recovery_unit: "stalwart-recovery"
stalwart_recovery_url: "http://127.0.0.1:8080"

stalwart_service_name: "stalwart"
stalwart_service_file_path: "/etc/systemd/system/{{ stalwart_service_name }}.service"
